<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE FINISH LINE</title>
  <!-- استدعاء مكتبة التصميم -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans p-6">
  
  <div id="app" class="max-w-3xl mx-auto">
    <div class="flex flex-col items-center justify-center mt-32 text-center">
      <p class="text-white text-xl animate-pulse">جاري التحميل...</p>
    </div>
  </div>

  <!-- استدعاء قاعدة البيانات وتسجيل الدخول من Firebase مباشرة -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, updateDoc, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // مفاتيح مشروعك التي أرسلتها لي
    const firebaseConfig = {
      apiKey: "AIzaSyCQLtwPfjTq-LJiOQwgfUFZGu07nOhX5Nk",
      authDomain: "the-finish-line-c6879.firebaseapp.com",
      projectId: "the-finish-line-c6879",
      storageBucket: "the-finish-line-c6879.firebasestorage.app",
      messagingSenderId: "311687251846",
      appId: "1:311687251846:web:abdfc927753e20f2ea8e07"
    };

    // تشغيل النظام
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const appDiv = document.getElementById('app');
    let currentUser = null;
    let tasks = [];
    let quotes = [
      "تخيل شعورك عندما تنتهي من كل شيء.",
      "لا تؤجل الشعور بالفخر بنفسك.",
      "المهمة التي تنجزها اليوم لن تضطر إلى حملها غداً.",
      "كل علامة صح هي وعد أوفيت به لنفسك."
    ];

    // مراقبة تسجيل الدخول
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        // جلب مهام المستخدم من السحابة
        const q = query(collection(db, "tasks"), where("userId", "==", user.uid));
        onSnapshot(q, (snapshot) => {
          tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          tasks.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
          renderApp();
        });
      } else {
        tasks = [];
        renderLogin();
      }
    });

    // دوال الأزرار
    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    window.addTask = async (e) => {
      e.preventDefault();
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      await addDoc(collection(db, "tasks"), {
        text: input.value,
        completed: false,
        userId: currentUser.uid,
        createdAt: serverTimestamp()
      });
      input.value = '';
    };

    window.toggleTask = async (id, currentStatus) => {
      await updateDoc(doc(db, "tasks", id), { completed: !currentStatus });
    };

    window.deleteTask = async (id) => {
      await deleteDoc(doc(db, "tasks", id));
    };

    // واجهة تسجيل الدخول
    function renderLogin() {
      appDiv.innerHTML = `
        <div class="flex flex-col items-center justify-center mt-20 text-center">
          <h1 class="text-4xl font-bold mb-4 tracking-wider text-white">THE FINISH LINE</h1>
          <p class="text-gray-400 mb-8 max-w-md">سجل دخولك لتبدأ رحلة إنجازك وتحفظ مهامك بأمان لتصل إليها من أي جهاز.</p>
          <button onclick="login()" class="bg-white text-gray-900 px-8 py-3 rounded-full font-bold hover:bg-gray-200 transition shadow-lg">
            تسجيل الدخول بحساب Google
          </button>
        </div>
      `;
    }

    // واجهة المهام
    function renderApp() {
      const completedCount = tasks.filter(t => t.completed).length;
      const progress = tasks.length === 0 ? 0 : Math.round((completedCount / tasks.length) * 100);
      const allDone = tasks.length > 0 && completedCount === tasks.length;
      
      let tasksHtml = tasks.map(task => `
        <div class="flex items-center justify-between p-4 rounded-lg border transition-all duration-300 ${task.completed ? 'bg-gray-800/50 border-gray-800 opacity-60' : 'bg-gray-800 border-gray-700 shadow-lg'} mb-3">
          <div class="flex items-center gap-4 cursor-pointer flex-1" onclick="toggleTask('${task.id}', ${task.completed})">
            <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${task.completed ? 'bg-emerald-500 border-emerald-500' : 'border-gray-500 hover:border-indigo-400'}">
              ${task.completed ? '<span class="text-white text-xs">✓</span>' : ''}
            </div>
            <span class="text-lg transition-all ${task.completed ? 'line-through text-gray-500' : 'text-white'}">${task.text}</span>
          </div>
          <button onclick="deleteTask('${task.id}')" class="text-gray-600 hover:text-red-400 p-2 text-xl leading-none">&times;</button>
        </div>
      `).join('');

      let celebrationHtml = allDone ? `
        <div class="bg-emerald-900/40 border border-emerald-800 rounded-xl p-8 text-center mb-8 transform transition-all scale-105">
          <h2 class="text-3xl font-bold text-emerald-400 mb-2">لقد أنهيت ما وعدت نفسك به اليوم! 🎉</h2>
          <p class="text-emerald-200/70">خذ لحظة، واستمتع بشعور الإنجاز. استحققت ذلك.</p>
        </div>
      ` : `
        <div class="text-center mb-8">
           <p class="text-lg text-indigo-300 italic">"${quotes[Math.floor(Math.random() * quotes.length)]}"</p>
        </div>
      `;

      appDiv.innerHTML = `
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4 mt-6">
          <div>
            <h1 class="text-2xl font-bold tracking-widest text-white">THE FINISH LINE</h1>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-sm text-gray-400">${currentUser.displayName}</span>
            <button onclick="logout()" class="text-xs bg-gray-800 px-3 py-1 rounded hover:bg-gray-700">خروج</button>
          </div>
        </header>

        ${celebrationHtml}

        <div class="mb-8">
          <div class="flex justify-between text-sm mb-2 text-gray-400">
            <span>نسبة الإنجاز</span>
            <span class="font-bold text-white">${progress}% (${completedCount}/${tasks.length})</span>
          </div>
          <div class="h-3 bg-gray-800 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-1000 ease-out" style="width: ${progress}%"></div>
          </div>
        </div>

        <form onsubmit="addTask(event)" class="mb-10 flex gap-2">
          <input type="text" id="taskInput" placeholder="ما الذي ستنجزه الآن؟..." class="flex-1 bg-gray-800 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-500" required />
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-lg font-bold transition">إضافة</button>
        </form>

        <div class="space-y-3 mb-12">
          ${tasksHtml.length > 0 ? tasksHtml : '<p class="text-center text-gray-500 py-6 border border-dashed border-gray-700 rounded-lg">لا توجد مهام حالياً، ابدأ بإضافة هدفك الأول!</p>'}
        </div>
      `;
    }
  </script>
</body>
</html>
